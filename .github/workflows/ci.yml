name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # uv.lock records this window; without it, `uv sync --locked` sees a stale lockfile.
  UV_EXCLUDE_NEWER: "1 week"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest and newest Python. The lowest job also runs 3.11, but with an old numpy.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major tags since v8, only immutable release tags.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      # The editable install reads files from src/, so only the wheel shows missing package data.
      - run: uv build --wheel
      - run: |
          files=$(unzip -Z1 dist/*.whl)
          for f in poikilos/base.mplstyle poikilos/looks/ poikilos/palettes/; do
            grep -q "^$f" <<< "$files" || { echo "wheel lacks $f"; exit 1; }
          done

  lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - run: uv run --resolution lowest-direct pytest -m "not images"
