[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "matplotlib-rosepine"
version = "0.1.0"
description = "Rosé Pine matplotlib styles with a vendored Google Sans Flex font"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "src/matplotlib_rosepine/fonts/OFL.txt"]
authors = [{ name = "Christian Samuel Ramirez", email = "chrisram0403@proton.me" }]
keywords = ["matplotlib", "rose-pine", "theme", "style", "plotting"]
dependencies = ["matplotlib>=3.6"]

[project.optional-dependencies]
preview = ["numpy"]

[dependency-groups]
dev = ["numpy"]

[tool.hatch.build.targets.wheel]
packages = ["src/matplotlib_rosepine"]
