[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poikilos"
version = "0.1.0"
description = "Matplotlib themes and figure helpers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christian Samuel Ramirez", email = "chrisram0403@proton.me" }]
keywords = ["matplotlib", "rose-pine", "lilaq", "theme", "style", "plotting"]
dependencies = ["matplotlib>=3.11"]

[project.optional-dependencies]
labels = [
    "adjusttext>=1.4.0",
]

[dependency-groups]
dev = [
    "adjusttext>=1.4.0",
    "numpy",
    "pytest>=8.4.2",
    "ruff==0.16.9",
    "typst>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/poikilos"]

[tool.hatch.build.targets.sdist]
exclude = ["/assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["images: compare rendered figures with tests/baseline"]

[tool.uv]
# uv.lock records this window, so `uv sync --locked` needs it on every machine.
exclude-newer = "1 week"
